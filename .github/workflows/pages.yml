name: Website

# Builds the landing page in website/ (a static Next.js export) and deploys it
# to GitHub Pages on every push to main. Pull requests that touch the site only
# build it, so a broken site is caught before it merges.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/package.json

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - run: bun install --frozen-lockfile
        working-directory: website

      - name: Build static site
        run: bun run build
        working-directory: website
        env:
          # The path GitHub Pages serves the site from: "/<repository>" for a
          # project site, "" for a custom domain. Pull requests have no Pages
          # context, so they build with the project-site path.
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
