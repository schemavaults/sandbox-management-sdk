name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:unit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Node smoke test (built package)
        run: node --version && node ./tests/smoke/node-smoke.mjs

  e2e-docker:
    name: E2E (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build fixture image
        run: bun run test:e2e:fixture-image
      - name: Build egress proxy image
        run: bun run test:e2e:egress-proxy-image
      - run: bun run test:e2e:docker
      - name: Remove leftover sandbox containers and networks
        if: always()
        run: |
          docker ps -aq --filter label=dev.schemavaults.sandbox.id | xargs -r docker rm -f
          docker ps -aq --filter label=dev.schemavaults.sandbox.egress-proxy | xargs -r docker rm -f
          docker network ls -q --filter label=dev.schemavaults.sandbox.egress-proxy | xargs -r docker network rm

  e2e-postgres:
    name: E2E (Postgres / dbh store)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_sdk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: sandbox_sdk_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:dbh
