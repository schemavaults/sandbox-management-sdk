name: Publish

# Releases the version in package.json when a push to main carries one that is
# not on npm yet; any other push stops after the first job. A release pushes the
# egress proxy image to GHCR, publishes the package to npm with trusted
# publishing (OIDC: no npm token is stored), then tags the commit v<version> and
# creates a GitHub release. Configure the trusted publisher for this repository
# and workflow file on npmjs.com (package settings -> Trusted publishing). The
# image is tagged with the package version, which DOCKER_EGRESS_PROXY_IMAGE
# points at. If a run fails partway, re-run its failed jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: Check whether this version is on npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet; releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  egress-proxy-image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image tag
        id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox-egress-proxy:${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Check whether this image is already published
        id: check
        run: |
          if docker buildx imagetools inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "${{ steps.tag.outputs.image }} already exists; skipping, so a released image never changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/egress-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}

  npm:
    needs: [version, egress-proxy-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run typecheck && bun run test:unit && bun run build
      - run: npm publish --provenance --access public

  github-release:
    needs: [version, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
