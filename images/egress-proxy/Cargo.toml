[package]
name = "sandbox-egress-proxy"
description = "Egress proxy that enforces network allowlists for @schemavaults/sandbox-management-sdk Docker sandboxes"
edition = "2024"
license = "MIT"
repository = "https://github.com/schemavaults/sandbox-management-sdk"
publish = false

[dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
